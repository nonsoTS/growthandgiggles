[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# CMS backend (netlify/functions/*), e.g. /api/edit -> functions/edit.js
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Site editor (public/admin/)
[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301

# Single-page app: let React Router handle every path.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed build assets never change, so browsers can cache them for a week.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"

# Lets the editor see which commit is deployed (it checks the live site cross-origin).
[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-store"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-cache"
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
